<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
  <title>Login - Chicken Noy</title>
  <meta name="description" content="Login to your Chicken Noy account to track orders and manage preferences.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <script>
    (function(){
      try {
        const token = localStorage.getItem('token');
        const userRaw = localStorage.getItem('user');
        const isLoggedIn = Boolean(token && userRaw && userRaw !== 'null' && userRaw !== 'undefined');
        if (isLoggedIn) document.documentElement.classList.add('user-logged-in');
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="navbar-logo"><img src="../images/logo.png" alt="Chicken Noy" onerror="this.style.display='none'; this.nextSibling.style.display='inline'"><span style="display:none">Chicken Noy</span></a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="dashboard.html">Orders</a>
    </div>
    <div class="auth-buttons">
      <a href="login.html" class="login-btn">Login</a>
      <a href="register.html" class="signin-btn">Sign In</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
  </nav>

  <main class="form-page">
    <h2>Login</h2>
    <form id="loginForm" autocomplete="on">
      <datalist id="savedAccountEmails"></datalist>
      <input name="loginEmail" type="text" placeholder="Email" autocomplete="email" list="savedAccountEmails" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <div class="password-field">
        <input name="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <button type="submit">Login</button>
    </form>
    <button type="button" class="form-link-button" id="showForgotPassword">Forgot Password</button>

    <form id="forgotPasswordForm" class="forgot-password-form" autocomplete="off" style="display:none;">
      <h3>Reset Password</h3>
      <input name="resetEmail" type="email" placeholder="Account Email" autocomplete="email" list="savedAccountEmails" autocapitalize="none" spellcheck="false" required>
      <div class="password-field">
        <input name="newPassword" type="password" placeholder="New Password" autocomplete="new-password" required>
        <button type="button" class="password-toggle" aria-label="Show new password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <div class="password-field">
        <input name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
        <button type="button" class="password-toggle" aria-label="Show confirm password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <button type="submit">Save New Password</button>
      <button type="button" class="form-secondary-button" id="cancelForgotPassword">Back to Login</button>
    </form>
  </main>

  <script>
  function toggleMenu() {
    const navLinks = document.getElementById('navLinks');
    const authButtons = document.querySelector('.auth-buttons');
    
    navLinks.classList.toggle('active');
    if (authButtons) authButtons.classList.toggle('active');
    
    // Close menu when clicking a link
    const links = navLinks.querySelectorAll('a');
    links.forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
        if (authButtons) authButtons.classList.remove('active');
      });
    });
  }

  // Close menu when clicking outside
  document.addEventListener('click', (e) => {
    const nav = document.querySelector('nav');
    const navLinks = document.getElementById('navLinks');
    
    if (nav && !nav.contains(e.target) && navLinks.classList.contains('active')) {
      navLinks.classList.remove('active');
      const authButtons = document.querySelector('.auth-buttons');
      if (authButtons) authButtons.classList.remove('active');
    }
  });

  // Close menu on escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const navLinks = document.getElementById('navLinks');
      const authButtons = document.querySelector('.auth-buttons');
      navLinks.classList.remove('active');
      if (authButtons) authButtons.classList.remove('active');
    }
  });

  function checkLogin() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const isLoggedIn = Boolean(token && user && user.name);
    document.body.classList.toggle('user-logged-in', isLoggedIn);
  }

  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    if (confirm('Are you sure you want to logout?')) {
      localStorage.clear();
      alert('Logged out successfully');
      window.location.href = 'index.html';
    }
  });

  document.getElementById('loginForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    const email = form.loginEmail.value.trim();
    const password = form.loginPassword.value;

    // Validation
    if (!email || !password) {
      alert('Please enter email and password');
      return;
    }

    // Prevent double submission
    if (btn.disabled) return;

    const originalText = btn.textContent;
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    // Timeout protection
    const timeoutId = setTimeout(() => {
      btn.textContent = originalText;
      btn.disabled = false;
      alert('Login took too long. Please try again.');
    }, 15000);

    try {
      const adminUsername = email.toLowerCase();
      if (["chickenoy", "admin", "chickenoyadmin"].includes(adminUsername)) {
        const { response: adminRes, data: adminJson } = await window.ChickenoyApi.request('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'ChickeNoy', password })
        });

        clearTimeout(timeoutId);
        if (!adminRes.ok) {
          btn.textContent = originalText;
          btn.disabled = false;
          alert(adminJson.error || 'Admin login failed');
          return;
        }

        localStorage.setItem('adminToken', adminJson.token);
        localStorage.setItem('adminUser', adminJson.username || 'ChickeNoy');
        localStorage.setItem('adminSessionActive', 'true');
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        btn.textContent = 'Admin dashboard';
        window.location.href = 'admin.html';
        return;
      }

      const controller = new AbortController();
      const fetchTimeout = setTimeout(() => controller.abort(), 12000);

      const { response: res, data: json } = await window.ChickenoyApi.request('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
        signal: controller.signal
      });

      clearTimeout(fetchTimeout);

      if (!res.ok) {
        clearTimeout(timeoutId);
        btn.textContent = originalText;
        btn.disabled = false;
        alert(json.error || json.message || 'Login failed');
        return;
      }

      // Store auth data
      localStorage.setItem('token', json.token);
      localStorage.setItem('user', JSON.stringify({
        id: json.id,
        name: json.name,
        email: json.email,
        phone: json.phone || ""
      }));
      saveAccountEmail(json.email || email);
      localStorage.setItem('welcomeToast', JSON.stringify({
        type: 'back',
        name: json.name || 'Guest'
      }));

      clearTimeout(timeoutId);

      // Show success with user name
      btn.textContent = 'Welcome Back!';
      btn.style.backgroundColor = '#27ae60';
      btn.style.color = '#ffffff';

      // Redirect after brief success display
      setTimeout(() => {
        form.reset();
        window.location.href = 'index.html';
      }, 500);

    } catch (error) {
      clearTimeout(timeoutId);
      btn.textContent = originalText;
      btn.disabled = false;

      if (error.name === 'AbortError') {
        alert('Connection timeout. Please try again.');
      } else {
        alert('Login error: ' + error.message);
      }
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    checkLogin();
    populateSavedAccountEmails();
    
    // Cache buster - clear old cache
    if ('caches' in window) {
      caches.keys().then(cacheNames => {
        cacheNames.forEach(cacheName => {
          caches.delete(cacheName);
        });
      });
    }
  });

  window.addEventListener('pageshow', populateSavedAccountEmails);

  document.getElementById('showForgotPassword')?.addEventListener('click', () => {
    document.getElementById('forgotPasswordForm').style.display = 'grid';
    document.getElementById('showForgotPassword').style.display = 'none';
  });

  document.getElementById('cancelForgotPassword')?.addEventListener('click', () => {
    const form = document.getElementById('forgotPasswordForm');
    form.reset();
    form.style.display = 'none';
    document.getElementById('showForgotPassword').style.display = 'inline-flex';
  });

  document.getElementById('forgotPasswordForm')?.addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.target;
    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    if (form.newPassword.value !== form.confirmPassword.value) {
      alert('New Password and Confirm Password must match.');
      return;
    }

    button.disabled = true;
    button.textContent = 'Saving...';

    try {
      const { response, data } = await window.ChickenoyApi.request('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: form.resetEmail.value.trim(),
          newPassword: form.newPassword.value,
          confirmPassword: form.confirmPassword.value
        })
      });

      if (!response.ok) throw new Error(data.error || 'Password reset failed');
      saveAccountEmail(form.resetEmail.value.trim());
      alert(data.message || 'Password updated.');
      form.reset();
      form.style.display = 'none';
      document.getElementById('showForgotPassword').style.display = 'inline-flex';
    } catch (error) {
      alert(error.message);
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  });

  function getSavedAccountEmails() {
    try {
      const saved = JSON.parse(localStorage.getItem('savedAccountEmails') || '[]');
      return Array.isArray(saved) ? saved.filter(Boolean).slice(0, 8) : [];
    } catch (error) {
      return [];
    }
  }

  function saveAccountEmail(email) {
    const value = String(email || '').trim().toLowerCase();
    if (!value || !value.includes('@')) return;
    const saved = getSavedAccountEmails().filter(item => item !== value);
    saved.unshift(value);
    localStorage.setItem('savedAccountEmails', JSON.stringify(saved.slice(0, 8)));
    populateSavedAccountEmails();
  }

  function populateSavedAccountEmails() {
    const list = document.getElementById('savedAccountEmails');
    if (!list) return;
    list.innerHTML = '';
    getSavedAccountEmails().forEach(email => {
      const option = document.createElement('option');
      option.value = email;
      list.appendChild(option);
    });
  }
  </script>
  <footer></footer>
  <script src="../JS/common.js?v=15"></script>
  <!-- PWA and Service Worker Setup -->
  <script src="../JS/pwa-setup.js"></script>
  <!-- Offline Error Handler -->
  <script src="../JS/offline-handler.js?v=3"></script>
</body>
</html>
